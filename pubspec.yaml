name: flutter_starter
description: Production-ready Flutter scaffold generated by the wizard.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.1.0
  dio: ^5.9.2
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
